name: AI Autonomous Issue Solver

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  solve-issue:
    # Issue text goes straight into an LLM that can push to main, so only
    # trust issues opened by repo owners/members/collaborators.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run AI Agent Pipeline
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional fallback: only used if Gemini fails AND this secret exists
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'z-ai/glm-5.3-flash'}}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          echo "=== Gathering Source Code Assets ==="
          {
            echo "=== CODEBASE CONTEXT ==="
            find src/ -name "*.java" -type f | while read -r file; do
              echo "--- FILE: $file ---"
              cat "$file"
              printf '\n--- END OF FILE ---\n\n'
            done
          } > "$RUNNER_TEMP/codebase.txt"

          echo "=== Building prompt ==="
          {
            echo "You are an autonomous senior developer. Review this issue (which could be a bug, feature request, or suggestion) and modify the codebase to satisfy it."
            echo "Issue Title: $ISSUE_TITLE"
            echo "Issue Body: $ISSUE_BODY"
            echo
            echo "Here is the application source code:"
            cat "$RUNNER_TEMP/codebase.txt"
            echo
            echo "CRITICAL OUTPUT FORMAT: Output ONLY a valid JSON object, with no markdown fences and no extra text. It must have exactly these keys:"
            echo '  "explanation": a clean engineering description of what you changed or added,'
            echo '  "filePath": the relative path of the one Java file to modify (e.g. src/main/java/com/example/App.java),'
            echo '  "fixedCode": the full, entire updated code for that file as a string.'
          } > "$RUNNER_TEMP/prompt.txt"

          # ---------- Gemini (primary) ----------
          jq -n --rawfile p "$RUNNER_TEMP/prompt.txt" \
            '{contents: [{parts: [{text: $p}]}],
              generationConfig: {responseMimeType: "application/json"}}' \
            > "$RUNNER_TEMP/gemini_request.json"

          echo "=== Consulting Gemini AI ==="
          MODELS=("gemini-flash-latest" )
          MAX_ATTEMPTS=1
          SUCCESS=false

          for GEMINI_MODEL in "${MODELS[@]}"; do
            for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
              HTTP_CODE=$(curl -sS -o "$RUNNER_TEMP/response.json" -w '%{http_code}' -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
                -H "Content-Type: application/json" \
                -H "x-goog-api-key: ${GEMINI_KEY}" \
                -d @"$RUNNER_TEMP/gemini_request.json" || echo "000")

              if [ "$HTTP_CODE" = "200" ]; then
                SUCCESS=true
                break 2
              fi

              echo "[$GEMINI_MODEL] attempt $ATTEMPT/$MAX_ATTEMPTS failed with HTTP $HTTP_CODE:"
              cat "$RUNNER_TEMP/response.json" 2>/dev/null || true
              echo

              case "$HTTP_CODE" in
                000|429|500|502|503|504)
                  if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                    SLEEP=$((ATTEMPT * 15))
                    echo "Transient error; retrying in ${SLEEP}s..."
                    sleep "$SLEEP"
                  fi
                  ;;
                *)
                  break
                  ;;
              esac
            done
            echo "Giving up on $GEMINI_MODEL, trying next model (if any)..."
          done

          if [ "$SUCCESS" = "true" ]; then
            echo "Gemini responded successfully using $GEMINI_MODEL"
            jq -r '.candidates[0].content.parts[0].text' "$RUNNER_TEMP/response.json" \
              > "$RUNNER_TEMP/model_output.txt"

          # ---------- NVIDIA (optional fallback) ----------
          elif [ -n "${NVIDIA_API_KEY:-}" ]; then
            echo "=== Gemini failed; falling back to NVIDIA ($NVIDIA_MODEL) ==="
            jq -n --arg m "$NVIDIA_MODEL" --rawfile p "$RUNNER_TEMP/prompt.txt" \
              '{model: $m,
                messages: [{role: "user", content: $p}],
                temperature: 0.2,
                max_tokens: 8192,
                stream: false}' \
              > "$RUNNER_TEMP/nvidia_request.json"

            NV_OK=false
            for ATTEMPT in $(seq 1 3); do
              HTTP_CODE=$(curl -sS --max-time 600 -o "$RUNNER_TEMP/nvidia_response.json" -w '%{http_code}' -X POST \
                "https://integrate.api.nvidia.com/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
                -d @"$RUNNER_TEMP/nvidia_request.json" || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then NV_OK=true; break; fi
              echo "NVIDIA attempt $ATTEMPT/3 failed with HTTP $HTTP_CODE:"
              cat "$RUNNER_TEMP/nvidia_response.json" 2>/dev/null || true
              echo
              sleep $((ATTEMPT * 15))
            done

            if [ "$NV_OK" != "true" ]; then
              echo "Both Gemini and NVIDIA failed."
              exit 1
            fi
            jq -r '.choices[0].message.content' "$RUNNER_TEMP/nvidia_response.json" \
              > "$RUNNER_TEMP/model_output.txt"

          else
            echo "All Gemini models failed and no fallback is configured."
            exit 1
          fi

          # Strip markdown fences in case the model adds them anyway
          sed '/^```/d' "$RUNNER_TEMP/model_output.txt" > "$RUNNER_TEMP/ai.json"

          FILE_PATH=$(jq -r '.filePath' "$RUNNER_TEMP/ai.json")
          jq -r '.explanation' "$RUNNER_TEMP/ai.json" > "$RUNNER_TEMP/explanation.txt"

          echo "AI target file identified: $FILE_PATH"
          echo "AI Change description: $(cat "$RUNNER_TEMP/explanation.txt")"

          # Safety checks on the model-chosen path
          case "$FILE_PATH" in
            src/*.java) ;;
            *) echo "Refusing path outside src/ or non-Java: $FILE_PATH"; exit 1 ;;
          esac
          case "$FILE_PATH" in
            *..*) echo "Refusing path containing '..': $FILE_PATH"; exit 1 ;;
          esac

          mkdir -p "$(dirname "$FILE_PATH")"
          jq -j '.fixedCode' "$RUNNER_TEMP/ai.json" > "$FILE_PATH"
          echo "$FILE_PATH" > "$RUNNER_TEMP/target_path.txt"

      - name: Verify Build Status
        run: ./gradlew build

      - name: Commit and Push AI Fix with Summary
        run: |
          set -euo pipefail
          TARGET_PATH=$(cat "$RUNNER_TEMP/target_path.txt")

          git config user.name "AI Engineering Agent"
          git config user.email "ai-agent@users.noreply.github.com"

          git add -- "$TARGET_PATH"
          if git diff --cached --quiet; then
            echo "AI produced no changes; nothing to commit."
            exit 1
          fi

          {
            echo "chore(ai): automated issue resolution"
            echo
            echo "AI Explanation: $(cat "$RUNNER_TEMP/explanation.txt")"
            echo "Resolves Issue #${{ github.event.issue.number }}"
          } > "$RUNNER_TEMP/commit_msg.txt"

          git commit -F "$RUNNER_TEMP/commit_msg.txt"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Comment on Resolved Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const explanation = fs.readFileSync(`${process.env.RUNNER_TEMP}/explanation.txt`, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **AI Response Applied Successfully!**\n\n**What changed:**\n${explanation}\n\nCode compilation checks passed! Changes have been committed.`
            });

      - name: Comment on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 The AI agent could not resolve this issue automatically. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            });
