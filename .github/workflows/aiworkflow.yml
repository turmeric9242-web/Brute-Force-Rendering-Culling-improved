name: AI Autonomous Issue Solver

on:
  issues:
    types: [opened]

# Required so the built-in GITHUB_TOKEN can push code changes and comment on issues
permissions:
  contents: write
  issues: write

jobs:
  solve-issue:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Run AI Agent Pipeline
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: |
        echo "=== Gathering Source Code Assets ==="
        echo "=== CODEBASE CONTEXT ===" > codebase.txt
        find src/ -name "*.java" -type f | while read -r file; do
          echo "--- FILE: $file ---" >> codebase.txt
          cat "$file" >> codebase.txt
          echo -e "\n--- END OF FILE ---\n" >> codebase.txt
        done

        echo "=== Consulting Gemini AI ==="
        PROMPT="You are an autonomous senior developer. Review this issue (which could be a bug, feature request, or suggestion) and modify the codebase to satisfy it.
        Issue Title: $ISSUE_TITLE
        Issue Body: $ISSUE_BODY

        Here is the application source code:
        $(cat codebase.txt)

        CRITICAL OUTPUT FORMAT: You must output ONLY a valid JSON object. Do not include markdown wraps like \`\`\`json.
        The JSON structure must match exactly:
        {
          \"explanation\": \"A clean engineering description of what you changed or added to satisfy the request.\",
          \"filePath\": \"The relative path to the Java file requiring modifications (e.g., src/main/java/com/example/App.java)\",
          \"fixedCode\": \"The full, entire updated code for that file as a string.\"
        }"

        ESCAPED_PROMPT=(echo "PROMPT" | jq -aRs .)

        RESPONSE=\$(curl -s -X POST "https://googleapis.com\${GEMINI_KEY}" \
          -H "Content-Type: application/json" \
          -d "{\"contents\": [{\"parts\": [{\"text\": \${ESCAPED_PROMPT}}]}]}")

        RAW_JSON=(echo "RESPONSE" | jq -r '.candidates[0].content.parts[0].text')

        FILE_PATH=(echo "RAW_JSON" | jq -r '.filePath')
        FIXED_CODE=(echo "RAW_JSON" | jq -r '.fixedCode')
        EXPLANATION=(echo "RAW_JSON" | jq -r '.explanation')

        echo "AI target file identified: \$FILE_PATH"
        echo "AI Change description: \$EXPLANATION"

        echo "\$FIXED_CODE" > updated_code.java
        
        echo "TARGET_PATH=\(FILE_PATH" >> "\)GITHUB_ENV"
        echo "AI_EXPLANATION<<EOF" >> "\$GITHUB_ENV"
        echo "EXPLANATION" >> "GITHUB_ENV"
        echo "EOF" >> "\$GITHUB_ENV"

    - name: Apply AI Changes
      run: |
        mv updated_code.java "\${{ env.TARGET_PATH }}"

    - name: Verify Build Status
      run: |
        ./gradlew build

    - name: Commit and Push AI Fix with Summary
      run: |
        git config --global user.name "AI Engineering Agent"
        git config --global user.email "ai-agent@github.com"
        
        git add .
        git commit -m "chore(ai): automated issue resolution

        AI Explanation: \${{ env.AI_EXPLANATION }}
        Resolves Issue #\${{ github.event.issue.number }}"
        
        git push origin main

    - name: Comment on Resolved Issue
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🤖 **AI Response Applied Successfully!**\n\n**What changed:**\n${process.env.AI_EXPLANATION}\n\nCode compilation checks passed! Changes have been committed to main.`
          })
      env:
        AI_EXPLANATION: \${{ env.AI_EXPLANATION }}
