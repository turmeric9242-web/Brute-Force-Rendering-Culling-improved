name: Java CI with Gradle and Release on Issue

on:
  issues:
    types: [opened, edited]

jobs:
  build-and-release:
    # Only run this job if the issue title is exactly "MAKE"
    if: github.event.issue.title == 'MAKE'
    
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release and upload assets

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configures Gradle and handles automatic dependency caching
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # Creates the GitHub Release and automatically uploads any generated .jar files
    - name: Create Release and Upload Jar Artifacts
      uses: softprops/action-gh-release@v2
      with:
        tag_name: release-issue-${{ github.event.issue.number }}-${{ github.run_number }}
        name: Release Triggered by Issue #${{ github.event.issue.number }}
        body: |
          Automated release generated from issue **${{ github.event.issue.title }}**.
          Triggered by @${{ github.actor }}.
        files: build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
