name: AI Autonomous Issue Solver

on:
  issues:
    types: [opened]

jobs:
  solve-issue:
    # Only runs if the issue contains a '[bug]' or '[fix]' request in the title
    if: contains(github.event.issue.title, '[bug]') || contains(github.event.issue.title, '[fix]')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }} # Allows the push to trigger other workflows

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Run AI Agent Pipeline
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: |
        echo "=== [1] Gathering Source Code Assets ==="
        # Concatenate codebase context into a structured layout for the AI context window
        echo "=== CODEBASE CONTEXT ===" > codebase.txt
        find src/ -name "*.java" -type f | while read -r file; do
          echo "--- FILE: $file ---" >> codebase.txt
          cat "$file" >> codebase.txt
          echo -e "\n--- END OF FILE ---\n" >> codebase.txt
        done

        echo "=== [2] Consulting Gemini AI ==="
        # Build the exact engineering prompt requesting structural json output
        PROMPT="You are an autonomous senior developer. Fix the bug described in this issue.
        Issue Title: $ISSUE_TITLE
        Issue Body: $ISSUE_BODY

        Here is the application source code:
        $(cat codebase.txt)

        CRITICAL OUTPUT FORMAT: You must output ONLY a valid JSON object. Do not include markdown wraps like \`\`\`json.
        The JSON structure must match exactly:
        {
          \"explanation\": \"A clean engineering description of what you changed to fix the issue.\",
          \"filePath\": \"The relative path to the Java file requiring fixing (e.g., src/main/java/com/example/App.java)\",
          \"fixedCode\": \"The full, entire updated code for that file as a string.\"
        }"

        # Escaping text safely to parse valid json down the line
        ESCAPED_PROMPT=(echo "PROMPT" | jq -aRs .)

        # Post standard REST payload directly to Gemini 2.5 Flash endpoint
        RESPONSE=\$(curl -s -X POST "https://googleapis.com\${GEMINI_KEY}" \
          -H "Content-Type: application/json" \
          -d "{\"contents\": [{\"parts\": [{\"text\": \${ESCAPED_PROMPT}}]}]}")

        # Extract the pure text string from the API structure
        RAW_JSON=(echo "RESPONSE" | jq -r '.candidates[0].content.parts[0].text')

        # Extract values using jq parsing keys natively
        FILE_PATH=(echo "RAW_JSON" | jq -r '.filePath')
        FIXED_CODE=(echo "RAW_JSON" | jq -r '.fixedCode')
        EXPLANATION=(echo "RAW_JSON" | jq -r '.explanation')

        echo "AI target file identified: \$FILE_PATH"
        echo "AI Change description: \$EXPLANATION"

        # Save values into the environment state across steps safely
        echo "\$FIXED_CODE" > updated_code.java
        echo "TARGET_PATH=\(FILE_PATH" >> \)GITHUB_ENV
        echo "AI_EXPLANATION=EXPLANATION" >> GITHUB_ENV

    - name: Apply AI Changes
      run: |
        # Replace the broken file with the fixed version generated by the AI
        mv updated_code.java "\${{ env.TARGET_PATH }}"

    - name: Verify Build Status
      run: |
        # Verify the AI fix compiles perfectly before pushing
        ./gradlew build

    - name: Commit and Push AI Fix with Summary
      run: |
        git config --global user.name "AI Engineering Agent"
        git config --global user.email "ai-agent@github.com"
        
        git add .
        # Commit includes the description produced explicitly by the AI explaining what it changed
        git commit -m "fix(ai): automated bug resolution

        AI Explanation: \${{ env.AI_EXPLANATION }}
        Resolves Issue #\${{ github.event.issue.number }}"
        
        git push origin main

    - name: Comment on Resolved Issue
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🤖 **AI Patch Applied Successfully!**\n\n**What changed:**\n${process.env.AI_EXPLANATION}\n\nCode compilation checks passed! Changes have been committed to main.`
          })
      env:
        AI_EXPLANATION: \${{ env.AI_EXPLANATION }}
