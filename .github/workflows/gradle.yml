name: Java CI with Gradle and Release on Commit

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release and upload assets

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configures Gradle and handles automatic dependency caching
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # Creates the GitHub Release and automatically uploads any generated .jar files
    - name: Create Release and Upload Jar Artifacts
      uses: softprops/action-gh-release@v2
      with:
        tag_name: release-${{ github.sha }}
        name: Release Build ${{ github.sha }}
        body: |
          Automated release generated from commit **${{ github.sha }}**.
          Triggered by @${{ github.actor }}.
        files: build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
